name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # The library has no dependencies, so what is being tested here is the
      # runtime itself: `node:test` and the assertion API changed shape across
      # these majors. Node 20 was here and came out on 2026-04-30, when it
      # reached end of life — testing against a runtime that no longer receives
      # security patches is theatre, not coverage.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # v7. Kept current on purpose: a workflow that pins an old major keeps
      # working right up until the runtime under it is retired, and then fails
      # on a day nobody chose. Dependabot watches these now (.github/dependabot.yml)
      # so the bump arrives as a pull request instead of as a broken build.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` needs the lockfile to agree with package.json. If it ever
      # doesn't, fall back rather than failing the run on a bookkeeping issue.
      - run: npm ci || npm install
      - run: npm test
      # Redundant on paper — `prepare` already ran `tsc` during install — but
      # kept explicit so a type error is reported as its own failed step
      # instead of hiding inside the install output.
      - run: npm run types

      # The README states a minified size in two places. Both were true when
      # they were written and both went quietly false the moment a module was
      # added. A number typed into prose is a measurement with no instrument
      # behind it; this is the instrument.
      - run: npm run size
