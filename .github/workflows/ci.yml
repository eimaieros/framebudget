name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # The library has no dependencies, so what is being tested here is the
      # runtime itself: `node:test` and the assertion API changed shape across
      # these majors. Node 20 was here and came out on 2026-04-30, when it
      # reached end of life — testing against a runtime that no longer receives
      # security patches is theatre, not coverage.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # v7. Kept current on purpose: a workflow that pins an old major keeps
      # working right up until the runtime under it is retired, and then fails
      # on a day nobody chose. Dependabot watches these now (.github/dependabot.yml)
      # so the bump arrives as a pull request instead of as a broken build.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # `npm ci`, and nothing after it. This was `npm ci || npm install`, so
      # that a lockfile out of step with package.json would not fail the run
      # over "a bookkeeping issue" — and then esbuild was added as a devDep
      # without regenerating the lockfile, `npm ci` failed exactly as designed,
      # `npm install` picked up the slack, and CI went green over a repository
      # nobody could reproduce with `npm ci`. The fallback did not tolerate the
      # problem; it concealed it. A mismatch is a real failure, so it fails.
      - run: npm ci

      # TAP goes to a file so the count check can read the run that just
      # happened instead of executing the whole suite a second time.
      #
      # `set -o pipefail` is the whole reason this is a block and not a one
      # liner. In a pipeline the exit status is the LAST command's, and `tee`
      # always succeeds — so without it a suite that failed every test would
      # report success. That is not hypothetical: the sibling portfolio repo
      # shipped `node harness.js | tail -1` and printed "Tudo passa" while its
      # first check was crashing. Same shape, same trap, one line apart.
      # `node --test --test-reporter=tap test/*.test.js`, with the flag BEFORE
      # the files, and not `npm test -- --test-reporter=tap`.
      #
      # The `npm test --` form puts the flag after the file arguments, and Node
      # 24 ignores a node option in that position where Node 22 honours it. The
      # first version of this step used it, and the result was a job called
      # "Tests, with the TAP kept" that kept no TAP on Node 24 — green on 22,
      # red on 24, off the same commit. Options go before positionals.
      - name: Tests, with the TAP kept
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.js | tee /tmp/testes.tap

      - name: The docs still state the right number of tests
        run: node tools/contagem.js /tmp/testes.tap

      # Redundant on paper — `prepare` already ran `tsc` during install — but
      # kept explicit so a type error is reported as its own failed step
      # instead of hiding inside the install output.
      - run: npm run types

      # The README states a minified size in two places. Both were true when
      # they were written and both went quietly false the moment a module was
      # added. A number typed into prose is a measurement with no instrument
      # behind it; this is the instrument. tools/contagem.js above is the same
      # instrument pointed at the test count, which drifted the same way: the
      # README said 37 and CONTRIBUTING said 24, on the same commit.
      - run: npm run size
